    <style>
        .travel-main {
            max-width: 42rem;
        }

        .travel-shell {
            color: var(--color-rurikon-400);
        }

        .travel-title {
            margin: 0;
            color: var(--color-rurikon-800);
            font-weight: 600;
        }

        .travel-deck {
            max-width: 38rem;
            margin-top: 1.75rem;
        }

        .travel-map-section {
            margin-top: 1.75rem;
        }

        .travel-map-section + .travel-map-section {
            margin-top: 3rem;
        }

        .travel-section-title {
            margin: 0;
            color: var(--color-rurikon-800);
            font-size: 1rem;
            font-weight: 600;
        }

        .travel-map-layout {
            display: grid;
            margin-top: 1rem;
        }

        .travel-map-panel {
            border: 1px solid rgb(54 183 201 / 24%);
            border-radius: 8px;
            background: rgb(255 255 255 / 68%);
            box-shadow: 0 18px 48px rgb(23 50 77 / 10%), 0 0 26px rgb(93 124 255 / 7%);
            backdrop-filter: blur(10px);
        }

        .travel-map-panel {
            position: relative;
            min-height: 24rem;
            overflow: hidden;
        }

        .travel-map-viewport {
            position: relative;
            height: min(78vh, 42rem);
            min-height: 24rem;
            overflow: hidden;
            cursor: grab;
            background: #f4f8fa;
            touch-action: pan-y pinch-zoom;
        }

        .travel-map-viewport.is-dragging {
            cursor: grabbing;
        }

        .travel-map-viewport:focus-visible {
            outline: 2px solid rgb(54 183 201 / 88%);
            outline-offset: -3px;
        }

        .travel-map-viewport:fullscreen {
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            background: #f4f8fa;
        }

        .travel-map-viewport:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            min-height: 100vh;
            background: #f4f8fa;
        }

        .travel-map-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center;
            will-change: transform;
        }

        .travel-map-image {
            display: block;
            width: 100%;
            height: 100%;
            user-select: none;
            -webkit-user-drag: none;
            transition: transform 220ms ease;
        }

        .travel-control:focus-visible {
            outline: 2px solid rgb(54 183 201 / 88%);
            outline-offset: 3px;
        }

        .travel-map-controls {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 4;
            display: flex;
            overflow: hidden;
            border: 1px solid rgb(54 183 201 / 28%);
            border-radius: 9999px;
            background: rgb(255 255 255 / 88%);
            box-shadow: 0 10px 28px rgb(23 50 77 / 14%), 0 0 20px rgb(54 183 201 / 7%);
            backdrop-filter: blur(12px);
        }

        .travel-control {
            display: grid;
            width: 2rem;
            height: 2rem;
            place-items: center;
            border: 0;
            border-right: 1px solid rgb(54 183 201 / 22%);
            color: var(--color-rurikon-300);
            background: transparent;
            cursor: pointer;
            font-family: "Google Sans Code", monospace;
            font-size: 0.95rem;
            line-height: 1;
            transition: color 150ms ease, background 150ms ease;
        }

        .travel-control svg {
            display: block;
            width: 1rem;
            height: 1rem;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2;
        }

        .travel-control:last-child {
            width: auto;
            min-width: 3.2rem;
            padding: 0 0.65rem;
            border-right: 0;
            font-size: 0.7rem;
        }

        .travel-control:hover {
            color: var(--color-rurikon-800);
            background: rgb(93 124 255 / 12%);
        }

        @media (min-width: 900px) {
            .travel-map-layout {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (max-width: 520px) {
            .travel-map-viewport {
                height: 70vh;
            }
        }
    </style>
</head>


<body class="
    w-full
    p-6 sm:p-10 md:p-14
    text-[14px] sm:text-[15px] md:text-[16px]
    leading-6 sm:leading-7 md:leading-7
    antialiased
">
    <div class="flex flex-col mobile:flex-row">
        <nav class="
            w-full mobile:w-24
            mr-0 mobile:mr-6 sm:mr-10 md:mr-14
        ">
            <ul class="
                mobile:sticky top-6 sm:top-10 md:top-14
                mb-6 mobile:mb-0
                flex flex-row justify-start items-end gap-2 mobile:flex-col
                font-lora italic
            ">
                <li class="text-rurikon-400 hover:text-rurikon-800 transition-colors -mx-4">
                    <a class="inline-block w-full px-4" draggable="false" href="./index.html">About</a>
                </li>
                <li class="text-rurikon-400 hover:text-rurikon-800 transition-colors -mx-4">
                    <a class="inline-block w-full px-4" draggable="false" href="./experience.html">Experience</a>
                </li>
                <li class="text-rurikon-400 hover:text-rurikon-800 transition-colors -mx-4">
                    <a class="inline-block w-full px-4" draggable="false" href="./publications.html">Publications</a>
                </li>
                <li class="text-rurikon-400 hover:text-rurikon-800 transition-colors -mx-4">
                    <a class="inline-block w-full px-4" draggable="false" href="./memory.html">Memory</a>
                </li>
                <li class="text-rurikon-800 -mx-4">
                    <a class="inline-block w-full px-4" draggable="false" aria-current="page" href="./travel.html">Travel</a>
                </li>
            </ul>
        </nav>


        <main class="relative flex-1 travel-main">
            <div class="
                absolute
                w-full h-px mobile:h-full mobile:w-px
                opacity-50 mobile:opacity-100
                bg-rurikon-border mix-blend-multiply
                top-0 left-0
            ">
            </div>
            <article class="
                font-merriweather
                pl-0 mobile:pl-6 sm:pl-10 md:pl-14
                pt-6 mobile:pt-0
                travel-shell
            ">
                <h1 class="travel-title">Travel</h1>
                <p class="travel-deck">
                    A quiet record of places I have visited and routes I have flown.
                </p>

                <section class="travel-map-section" aria-labelledby="places-visited-title">
                    <h2 id="places-visited-title" class="travel-section-title">Places Visited</h2>
                    <div class="travel-map-layout">
                        <div class="travel-map-panel">
                            <div class="travel-map-viewport" data-travel-map tabindex="0" role="group" aria-label="Interactive map of places visited in China">
                                <div class="travel-map-controls" role="group" aria-label="Places Visited map controls">
                                    <button class="travel-control" data-map-action="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">-</button>
                                    <button class="travel-control" data-map-action="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
                                    <button class="travel-control" data-map-action="fullscreen" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">
                                        <svg viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                                            <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
                                            <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
                                            <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
                                        </svg>
                                    </button>
                                    <button class="travel-control" data-map-action="reset" type="button" aria-label="Reset map" title="Reset map">Reset</button>
                                </div>
                                <div class="travel-map-stage" data-map-stage>
                                    <img class="travel-map-image" data-map-image src="./public/Travel.png" alt="China map with highlighted visited areas" draggable="false">
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="travel-map-section" aria-labelledby="flight-routes-title">
                    <h2 id="flight-routes-title" class="travel-section-title">Flight Routes</h2>
                    <div class="travel-map-layout">
                        <div class="travel-map-panel">
                            <div class="travel-map-viewport" data-travel-map tabindex="0" role="group" aria-label="Interactive map of flight routes between China and Japan">
                                <div class="travel-map-controls" role="group" aria-label="Flight Routes map controls">
                                    <button class="travel-control" data-map-action="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">-</button>
                                    <button class="travel-control" data-map-action="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
                                    <button class="travel-control" data-map-action="fullscreen" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">
                                        <svg viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                                            <path d="M16 3h3a2 2 0 0 1 2 2v3"></path>
                                            <path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>
                                            <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
                                        </svg>
                                    </button>
                                    <button class="travel-control" data-map-action="reset" type="button" aria-label="Reset map" title="Reset map">Reset</button>
                                </div>
                                <div class="travel-map-stage" data-map-stage>
                                    <img class="travel-map-image" data-map-image src="./public/Flight.png" alt="Map of East Asia showing the author's flight routes between airports in China and Japan." draggable="false">
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </article>
        </main>
    </div>

    <script>
        const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

        const getFullscreenElement = () => {
            return document.fullscreenElement || document.webkitFullscreenElement || null;
        };

        const initTravelMap = (viewportElement) => {
            const stageElement = viewportElement.querySelector("[data-map-stage]");
            const imageElement = viewportElement.querySelector("[data-map-image]");
            const zoomInButton = viewportElement.querySelector('[data-map-action="zoom-in"]');
            const zoomOutButton = viewportElement.querySelector('[data-map-action="zoom-out"]');
            const fullscreenButton = viewportElement.querySelector('[data-map-action="fullscreen"]');
            const resetButton = viewportElement.querySelector('[data-map-action="reset"]');

            if (!stageElement || !imageElement || !zoomInButton || !zoomOutButton || !fullscreenButton || !resetButton) {
                return null;
            }

            let imageWidth = 0;
            let imageHeight = 0;
            let fitScale = 1;
            let zoom = 1;
            let panX = 0;
            let panY = 0;
            let dragStart = null;

            const getMaxZoom = () => {
                return Math.max(4, Math.min(10, Number((1 / fitScale).toFixed(2))));
            };

            const getRenderedSize = () => {
                const scale = fitScale * zoom;
                return {
                    width: imageWidth * scale,
                    height: imageHeight * scale,
                };
            };

            const constrainPan = () => {
                const viewportRect = viewportElement.getBoundingClientRect();
                const renderedSize = getRenderedSize();
                const maxPanX = Math.max(0, (renderedSize.width - viewportRect.width) / 2);
                const maxPanY = Math.max(0, (renderedSize.height - viewportRect.height) / 2);
                panX = clamp(panX, -maxPanX, maxPanX);
                panY = clamp(panY, -maxPanY, maxPanY);
            };

            const applyTransform = () => {
                if (!imageWidth || !imageHeight) {
                    return;
                }

                viewportElement.style.touchAction = zoom > 1 ? "none" : "pan-y pinch-zoom";
                constrainPan();
                stageElement.style.transform = "translate(calc(-50% + " + panX + "px), calc(-50% + " + panY + "px)) scale(" + (fitScale * zoom) + ")";
            };

            const measureFitScale = () => {
                if (!imageWidth || !imageHeight) {
                    return;
                }

                const viewportRect = viewportElement.getBoundingClientRect();
                const padding = 32;
                fitScale = Math.max(0.01, Math.min(
                    (viewportRect.width - padding) / imageWidth,
                    (viewportRect.height - padding) / imageHeight,
                    1
                ));
                zoom = clamp(zoom, 1, getMaxZoom());
                applyTransform();
            };

            const resetMap = () => {
                zoom = 1;
                panX = 0;
                panY = 0;
                applyTransform();
            };

            const zoomMap = (step) => {
                zoom = clamp(Number((zoom + step).toFixed(2)), 1, getMaxZoom());
                applyTransform();
            };

            const updateFullscreenButton = () => {
                const isFullscreen = getFullscreenElement() === viewportElement;
                const label = isFullscreen ? "Exit fullscreen" : "Enter fullscreen";
                fullscreenButton.setAttribute("aria-label", label);
                fullscreenButton.title = label;
            };

            const toggleFullscreen = () => {
                if (getFullscreenElement()) {
                    const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
                    if (exitFullscreen) {
                        try {
                            const fullscreenExit = exitFullscreen.call(document);
                            if (fullscreenExit && typeof fullscreenExit.catch === "function") {
                                fullscreenExit.catch(updateFullscreenButton);
                            }
                        } catch {
                            updateFullscreenButton();
                        }
                    }
                    return;
                }

                const requestFullscreen = viewportElement.requestFullscreen || viewportElement.webkitRequestFullscreen;
                if (requestFullscreen) {
                    try {
                        const fullscreenRequest = requestFullscreen.call(viewportElement);
                        if (fullscreenRequest && typeof fullscreenRequest.catch === "function") {
                            fullscreenRequest.catch(updateFullscreenButton);
                        }
                    } catch {
                        updateFullscreenButton();
                    }
                }
            };

            const endDrag = () => {
                viewportElement.classList.remove("is-dragging");
                dragStart = null;
            };

            const initializeImage = () => {
                imageWidth = imageElement.naturalWidth;
                imageHeight = imageElement.naturalHeight;

                if (!imageWidth || !imageHeight) {
                    return;
                }

                stageElement.style.width = imageWidth + "px";
                stageElement.style.height = imageHeight + "px";
                measureFitScale();
            };

            viewportElement.addEventListener("pointerdown", (event) => {
                if (event.target.closest("button") || !imageWidth || !imageHeight) {
                    return;
                }

                viewportElement.focus({ preventScroll: true });
                viewportElement.setPointerCapture(event.pointerId);
                viewportElement.classList.add("is-dragging");
                dragStart = {
                    pointerId: event.pointerId,
                    startX: event.clientX,
                    startY: event.clientY,
                    panX,
                    panY,
                };
            });

            viewportElement.addEventListener("pointermove", (event) => {
                if (!dragStart || dragStart.pointerId !== event.pointerId) {
                    return;
                }

                panX = dragStart.panX + event.clientX - dragStart.startX;
                panY = dragStart.panY + event.clientY - dragStart.startY;
                applyTransform();
            });

            viewportElement.addEventListener("pointerup", endDrag);
            viewportElement.addEventListener("pointercancel", endDrag);
            viewportElement.addEventListener("lostpointercapture", endDrag);

            viewportElement.addEventListener("wheel", (event) => {
                const step = event.deltaY > 0 ? -0.24 : 0.24;
                const nextZoom = clamp(Number((zoom + step).toFixed(2)), 1, getMaxZoom());
                const isModifierZoom = event.ctrlKey || event.metaKey;
                const isMapActive = viewportElement.matches(":focus-within");

                if (!isModifierZoom && (!isMapActive || nextZoom === zoom)) {
                    return;
                }

                event.preventDefault();
                if (nextZoom !== zoom) {
                    zoomMap(step);
                }
            }, { passive: false });

            viewportElement.addEventListener("dblclick", () => zoomMap(0.45));

            viewportElement.addEventListener("keydown", (event) => {
                if (event.key === "+" || event.key === "=") {
                    event.preventDefault();
                    zoomMap(0.35);
                }

                if (event.key === "-") {
                    event.preventDefault();
                    zoomMap(-0.35);
                }

                if (event.key === "0") {
                    event.preventDefault();
                    resetMap();
                }
            });

            zoomInButton.addEventListener("click", () => zoomMap(0.35));
            zoomOutButton.addEventListener("click", () => zoomMap(-0.35));
            fullscreenButton.addEventListener("click", toggleFullscreen);
            resetButton.addEventListener("click", resetMap);

            if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) {
                fullscreenButton.hidden = true;
            }

            if (imageElement.complete && imageElement.naturalWidth) {
                initializeImage();
            } else {
                imageElement.addEventListener("load", initializeImage, { once: true });
            }

            updateFullscreenButton();

            return {
                measureFitScale,
                updateFullscreenButton,
            };
        };

        const travelMaps = Array.from(document.querySelectorAll("[data-travel-map]"))
            .map(initTravelMap)
            .filter(Boolean);

        const refreshTravelMaps = () => {
            travelMaps.forEach((map) => {
                map.updateFullscreenButton();
                map.measureFitScale();
            });
        };

        window.addEventListener("resize", refreshTravelMaps);
        document.addEventListener("fullscreenchange", () => requestAnimationFrame(refreshTravelMaps));
        document.addEventListener("webkitfullscreenchange", () => requestAnimationFrame(refreshTravelMaps));
    </script>

</body>
