<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A chronological collection of photographs by Jianhao Zeng.">
    <link href="./output.css?v=20260903-8" rel="stylesheet">
    <title>Memory — Jianhao Zeng</title>
    <link rel="shortcut icon" href="./public/avatar.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        rel="stylesheet">
</head>

<body class="memory-page">
    <div id="memory-page-content" class="memory-shell">
        <header class="memory-header">
            <div class="memory-header__identity">
                <a class="memory-home" href="./index.html" aria-label="Back to Jianhao Zeng's home page">
                    <span class="memory-home__mark" aria-hidden="true">&lt;</span>
                    <span>Jianhao Zeng</span>
                </a>
                <h1 class="memory-sr-only">Memory</h1>
            </div>

            <button id="memory-view-toggle" class="memory-view-toggle" type="button" aria-pressed="true"
                aria-label="Show full composition" title="Show full composition">
                <svg class="memory-view-toggle__icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3.5" y="3.5" width="17" height="17" rx="1.5"></rect>
                    <path d="M12 3.5v17M3.5 12h17"></path>
                </svg>
            </button>
        </header>

        <main>
            <article id="memory-gallery" class="memory-gallery" data-view="crop"
                aria-label="Photo memories by year"></article>
        </main>
    </div>

    <div id="memory-lightbox" class="memory-lightbox" role="dialog" aria-modal="true"
        aria-label="Image preview" aria-describedby="memory-lightbox-status" hidden>
        <button id="memory-lightbox-close" class="memory-lightbox__button memory-lightbox__button--close"
            type="button" aria-label="Close preview" title="Close preview">
            <svg class="memory-lightbox__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18"></path>
                <path d="M6 6 18 18"></path>
            </svg>
        </button>
        <button id="memory-lightbox-previous" class="memory-lightbox__button memory-lightbox__button--previous"
            type="button" aria-label="Previous image" title="Previous image">
            <svg class="memory-lightbox__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
            </svg>
        </button>
        <img id="memory-lightbox-image" class="memory-lightbox__image" alt="">
        <button id="memory-lightbox-next" class="memory-lightbox__button memory-lightbox__button--next"
            type="button" aria-label="Next image" title="Next image">
            <svg class="memory-lightbox__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 18 6-6-6-6"></path>
            </svg>
        </button>
        <p id="memory-lightbox-status" class="memory-sr-only" aria-live="polite"></p>
    </div>

    <script src="./memory-images.js"></script>
    <script>
        const THUMBNAIL_TRANSFORM = "c_limit,w_1200,h_1200";
        const EAGER_IMAGE_COUNT = 4;
        const gallery = document.getElementById("memory-gallery");
        const viewToggle = document.getElementById("memory-view-toggle");
        const pageContent = document.getElementById("memory-page-content");
        const lightbox = document.getElementById("memory-lightbox");
        const lightboxImage = document.getElementById("memory-lightbox-image");
        const lightboxStatus = document.getElementById("memory-lightbox-status");
        const lightboxCloseButton = document.getElementById("memory-lightbox-close");
        const lightboxPreviousButton = document.getElementById("memory-lightbox-previous");
        const lightboxNextButton = document.getElementById("memory-lightbox-next");
        let activeImageIndex = 0;
        let activeImageTrigger = null;
        let cropViewIsActive = true;

        const isAbsoluteUrl = (value) => /^https?:\/\//i.test(value);

        const getImageUrl = (baseUrl, image, transform = "") => {
            if (isAbsoluteUrl(image)) {
                return image;
            }

            const normalizedBaseUrl = baseUrl.endsWith("/") ? baseUrl : `${baseUrl}/`;
            const transformation = transform ? `${transform}/` : "";
            return `${normalizedBaseUrl}${transformation}${image}`;
        };

        const memoryImageGroups = window.memoryImageConfig.groups.map((group) => {
            return {
                year: group.year,
                images: group.images.map((image, groupIndex) => ({
                    alt: `Photo ${groupIndex + 1} from ${group.year}`,
                    src: getImageUrl(window.memoryImageConfig.baseUrl, image),
                    thumbnailSrc: getImageUrl(window.memoryImageConfig.baseUrl, image, THUMBNAIL_TRANSFORM),
                })),
            };
        });

        const memoryImages = memoryImageGroups.flatMap((group) => group.images);
        memoryImages.forEach((image, index) => {
            image.index = index;
        });

        const preloadAdjacentImages = () => {
            [-1, 1].forEach((offset) => {
                const index = (activeImageIndex + offset + memoryImages.length) % memoryImages.length;
                const preloadImage = new Image();
                preloadImage.src = memoryImages[index].src;
            });
        };

        const showLightboxImage = (index) => {
            activeImageIndex = (index + memoryImages.length) % memoryImages.length;
            const image = memoryImages[activeImageIndex];

            lightboxImage.src = image.src;
            lightboxImage.alt = image.alt;
            lightboxStatus.textContent = `${image.alt}. Image ${activeImageIndex + 1} of ${memoryImages.length}.`;
            preloadAdjacentImages();
        };

        const openLightbox = (index, trigger) => {
            activeImageTrigger = trigger;
            showLightboxImage(index);
            lightbox.hidden = false;
            pageContent.inert = true;
            document.body.classList.add("memory-lightbox-open");
            lightboxCloseButton.focus();
        };

        const closeLightbox = () => {
            lightbox.hidden = true;
            lightboxImage.removeAttribute("src");
            lightboxStatus.textContent = "";
            pageContent.inert = false;
            document.body.classList.remove("memory-lightbox-open");

            if (activeImageTrigger && document.contains(activeImageTrigger)) {
                activeImageTrigger.focus();
            }
        };

        const moveLightbox = (step) => {
            showLightboxImage(activeImageIndex + step);
        };

        const createImageCard = (image) => {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "memory-image-card";
            card.setAttribute("aria-label", `Open ${image.alt.toLowerCase()}`);
            card.addEventListener("click", () => openLightbox(image.index, card));

            const img = document.createElement("img");
            img.className = "memory-image-card__image";
            img.alt = image.alt;
            img.decoding = "async";
            img.loading = image.index < EAGER_IMAGE_COUNT ? "eager" : "lazy";
            if (image.index < EAGER_IMAGE_COUNT) {
                img.fetchPriority = "high";
            }

            const markImageAsLoaded = () => card.classList.add("is-loaded");
            img.addEventListener("load", markImageAsLoaded, { once: true });
            img.addEventListener("error", () => card.classList.add("is-error"), { once: true });
            img.src = image.thumbnailSrc;

            const fallback = document.createElement("span");
            fallback.className = "memory-image-card__fallback";
            fallback.setAttribute("aria-hidden", "true");
            fallback.textContent = "Image unavailable";

            card.append(img, fallback);

            if (img.complete && img.naturalWidth > 0) {
                markImageAsLoaded();
            }

            return card;
        };

        const renderMemoryGallery = () => {
            const fragment = document.createDocumentFragment();

            memoryImageGroups.forEach((group) => {
                const section = document.createElement("section");
                section.className = "memory-year";
                section.setAttribute("aria-labelledby", `memory-year-${group.year}`);

                const heading = document.createElement("h2");
                heading.id = `memory-year-${group.year}`;
                heading.className = "memory-year__heading";
                heading.textContent = group.year;

                const grid = document.createElement("div");
                grid.className = "memory-grid";
                group.images.forEach((image) => grid.append(createImageCard(image)));

                section.append(heading, grid);
                fragment.append(section);
            });

            gallery.replaceChildren(fragment);
        };

        const updateViewToggle = () => {
            const label = cropViewIsActive ? "Show full composition" : "Switch to square crop";
            gallery.dataset.view = cropViewIsActive ? "crop" : "contain";
            viewToggle.setAttribute("aria-pressed", String(cropViewIsActive));
            viewToggle.setAttribute("aria-label", label);
            viewToggle.title = label;
        };

        const trapLightboxFocus = (event) => {
            const focusableElements = [
                lightboxCloseButton,
                lightboxPreviousButton,
                lightboxNextButton,
            ].filter((element) => !element.hidden && !element.disabled);
            const firstElement = focusableElements[0];
            const lastElement = focusableElements[focusableElements.length - 1];

            if (event.shiftKey && document.activeElement === firstElement) {
                event.preventDefault();
                lastElement.focus();
            } else if (!event.shiftKey && document.activeElement === lastElement) {
                event.preventDefault();
                firstElement.focus();
            }
        };

        renderMemoryGallery();
        updateViewToggle();

        viewToggle.addEventListener("click", () => {
            cropViewIsActive = !cropViewIsActive;
            updateViewToggle();
        });
        lightboxCloseButton.addEventListener("click", closeLightbox);
        lightboxPreviousButton.addEventListener("click", () => moveLightbox(-1));
        lightboxNextButton.addEventListener("click", () => moveLightbox(1));
        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener("keydown", (event) => {
            if (lightbox.hidden) {
                return;
            }

            if (event.key === "Tab") {
                trapLightboxFocus(event);
                return;
            }

            if (event.key === "Escape") {
                event.preventDefault();
                closeLightbox();
            } else if (event.key === "ArrowLeft") {
                event.preventDefault();
                moveLightbox(-1);
            } else if (event.key === "ArrowRight") {
                event.preventDefault();
                moveLightbox(1);
            }
        });
    </script>
</body>

</html>
